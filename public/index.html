<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f0e" />
    <meta name="robots" content="noindex, follow" />
    <title>Eiliya Abedini</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root{--ink:#0d0f0e;--paper:#f1eee6;--acid:#d8ff66;--accent:#ff5c35}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.25rem;background:var(--ink);color:var(--paper);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:4rem 4rem;mask-image:radial-gradient(circle at center,#000,transparent 78%)}.gateway{position:relative;z-index:1;width:min(50rem,100%);text-align:center}.mark{display:grid;width:3.6rem;height:3.6rem;margin:0 auto 3rem;place-items:center;border:1px solid currentColor;border-radius:50%;font-size:.8rem;font-weight:800}.intro{margin:0;color:#92958f;font-size:.72rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.gateway h1{margin:1rem 0 2.7rem;font-family:"Iowan Old Style",Baskerville,Georgia,serif;font-size:clamp(3.5rem,10vw,7.7rem);font-weight:400;letter-spacing:-.07em;line-height:.82}.gateway h1 em{color:var(--accent);font-weight:400}.choices{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:min(33rem,100%);margin-inline:auto}.choice{position:relative;overflow:hidden;padding:1.15rem 1.25rem;border:1px solid rgba(241,238,230,.2);border-radius:999px;background:rgba(241,238,230,.04);text-align:left;color:inherit;text-decoration:none;font-size:.78rem;font-weight:750;transition:background .2s,color .2s}.choice span{float:right}.choice:hover{background:var(--paper);color:var(--ink)}.choice--fa{text-align:right;font-family:Tahoma,Arial,sans-serif}.links{display:inline-flex;align-items:center;gap:.55rem;margin-top:1.8rem;padding-bottom:.25rem;border-bottom:1px solid rgba(241,238,230,.35);color:#b3b4af;font-size:.72rem;font-weight:700;text-decoration:none}.status{margin-top:3rem;color:#686b67;font-size:.63rem;letter-spacing:.08em;text-transform:uppercase}.orb{position:absolute;z-index:-1;top:50%;left:50%;width:min(86vw,48rem);aspect-ratio:1;border:1px solid rgba(241,238,230,.08);border-radius:50%;transform:translate(-50%,-50%)}.orb:before,.orb:after{content:"";position:absolute;border:1px solid rgba(241,238,230,.08);border-radius:50%}.orb:before{inset:16%}.orb:after{inset:32%}.dot{position:absolute;top:15%;right:18%;width:.65rem;height:.65rem;border-radius:50%;background:var(--acid);box-shadow:0 0 2rem var(--acid)}@media(max-width:560px){.mark{margin-bottom:2rem}.choices{grid-template-columns:1fr}.choice{text-align:center}.choice span{float:none;margin-left:.5rem}.choice--fa{text-align:center}.gateway h1{font-size:clamp(3.7rem,18vw,6.2rem)}.status{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
    <script>
      (() => {
        const saved = localStorage.getItem("ea_language");
        if (saved === "fa" || saved === "en") {
          location.replace(`/${saved}/`);
          return;
        }
        if ((navigator.language || "").toLowerCase().startsWith("fa")) location.replace("/fa/");
      })();
    </script>
  </head>
  <body>
    <main class="gateway">
      <div class="orb" aria-hidden="true"><i class="dot"></i></div>
      <span class="mark">EA</span>
      <p class="intro">Welcome · خوش آمدید</p>
      <h1>Choose your<br /><em>perspective.</em></h1>
      <div class="choices">
        <a class="choice" href="/en/" data-language="en">English <span>↗</span></a>
        <a class="choice choice--fa" href="/fa/" data-language="fa" lang="fa" dir="rtl">فارسی <span>↗</span></a>
      </div>
      <a class="links" href="/links/">Just the links <span>↗</span></a>
      <p class="status">Engineer · Builder · Creator</p>
    </main>
    <script>
      document.querySelectorAll("[data-language]").forEach((link) => link.addEventListener("click", () => localStorage.setItem("ea_language", link.dataset.language)));
    </script>
  </body>
</html>
